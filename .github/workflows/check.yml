name: Проверки и Windows-сборка
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tools/*.test.mjs
      - run: node tools/check-gallery.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failures-${{ matrix.os }}
          path: test-results/
  desktop:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm test:desktop
      - run: pnpm package:desktop
      - name: Проверить собранное приложение
        shell: pwsh
        run: |
          $env:MODEL_STUDIO_TEST_EXE = Join-Path (Get-Location) 'dist/ModelStudio-win32-x64/ModelStudio.exe'
          pnpm test:desktop
      - name: Упаковать Windows-приложение
        shell: pwsh
        run: Compress-Archive -LiteralPath 'dist/ModelStudio-win32-x64' -DestinationPath 'dist/ModelStudio-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ModelStudio-Windows-x64
          path: dist/ModelStudio-Windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: desktop-failures
          path: desktop-test-results/
