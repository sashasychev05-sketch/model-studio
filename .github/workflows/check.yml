name: Проверки и Windows-сборка
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tools/*.test.mjs
      - run: node tools/check-gallery.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failures-${{ matrix.os }}
          path: test-results/
  desktop:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm test:desktop
      - run: pnpm package:desktop
      - name: Проверить собранное приложение
        shell: pwsh
        run: |
          $env:MODEL_STUDIO_TEST_EXE = Join-Path (Get-Location) 'dist/ModelStudio-win32-x64/ModelStudio.exe'
          pnpm test:desktop
      - name: Собрать предыдущую версию для проверки установки
        shell: pwsh
        run: |
          $env:MODEL_STUDIO_TEST_BUILD_VERSION = '2.3.0'
          pnpm package:installer
      - name: Собрать установщик
        run: pnpm package:installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          MODEL_STUDIO_REQUIRE_SIGNING: ${{ vars.WINDOWS_REQUIRE_SIGNING }}
      - name: Проверить реальную загрузку обновления
        shell: pwsh
        run: |
          $env:MODEL_STUDIO_TEST_EXE = Join-Path (Get-Location) 'dist/installer/win-unpacked/ModelStudio.exe'
          $releaseVersion = (Get-Content package.json | ConvertFrom-Json).version
          $env:MODEL_STUDIO_UPDATE_ASSET = Join-Path (Get-Location) "dist/installer/ModelStudio-Setup-$releaseVersion-x64.exe"
          pnpm test:desktop --grep "Desktop window|Real NSIS updater"
      - name: Проверить установку и сохранность при обновлении
        shell: pwsh
        run: |
          $env:MODEL_STUDIO_INSTALLER_TEST = '1'
          pnpm test:desktop --grep "NSIS installs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-installer
          path: |
            dist/installer/ModelStudio-Setup-*.exe
            dist/installer/ModelStudio-Setup-*.exe.blockmap
            dist/installer/latest.yml
      - name: Упаковать Windows-приложение
        shell: pwsh
        run: Compress-Archive -LiteralPath 'dist/ModelStudio-win32-x64' -DestinationPath 'dist/ModelStudio-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ModelStudio-Windows-x64
          path: dist/ModelStudio-Windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: desktop-failures
          path: desktop-test-results/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: model-studio-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Windows-installer
          path: dist/release
      - run: node tools/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
